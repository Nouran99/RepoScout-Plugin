name: RepoScout Plugin CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reposcout-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  plugin-checks:
    name: Plugin checks (lint / type / test / package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/reposcout
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest --tb=short -q
      - name: Validate marketplace package
        run: uv run python ../../scripts/marketplace_preflight.py --plugin-dir .
      - name: Upload package artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: reposcout-plugin-${{ github.ref_name }}
          path: plugins/reposcout/dist/*
          if-no-files-found: error
