version: 2
updates:
  - package-ecosystem: pip
    directory: /plugins/reposcout
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    commit-message:
      prefix: deps
      include: scope
    groups:
      plugin-low-risk:
        patterns: ['*']
        update-types: [patch]
