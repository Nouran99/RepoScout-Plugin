[project]
name = "reposcout-plugin"
version = "1.0.1"
description = "MCP server and Claude Code plugin — find an open-source project to bootstrap your next build"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nouran" }]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0,<3.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.0,<27.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.scripts]
reposcout-mcp = "mcp_server.cli:main"

[project.urls]
Homepage = "https://nouran-darwish-ai.dev/reposcout"
Repository = "https://github.com/Nouran99/RepoScout-Plugin/tree/main/plugins/reposcout"
Issues = "https://github.com/Nouran99/RepoScout-Plugin/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
